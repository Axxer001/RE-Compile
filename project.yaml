# CCGS project configuration — single source of truth for project settings.
# See .claude/docs/effects-map.md for full schema.

schema_version: 1

framework:
  version: 1.3.0
  last_upgraded: 2026-11-09

# NOTE: this template ships with no `modes:` block, and the six knobs below must
# never be added to one.
#
# `/start` DOES add `modes.rigor` and `modes.automation` here — that is its job,
# and a `modes:` block containing those two is the expected state of a configured
# project, not a mistake.
#
# What must stay absent is the six knobs `modes.rigor` FRONTS:
# `modes.review_mode`, `modes.workflow`, `docs.density`, `qa.level`,
# `modes.story_granularity` and `team.size`. Seeding any of them in this file
# pins that value and shadows the rigor expansion, so the rigor `/start` infers
# and saves would stop changing anything. `/start` states the same rule for the
# settings it writes.
#
# Per-developer preferences belong in `project.local.yaml` (gitignored), not
# here. `/project-settings --local <key>=<value>` writes there; `/project-settings <key>=<value>`
# edits this file. See `.claude/docs/config-resolution.md` for the full
# precedence order.

# RE:Compile [2026-11-15]: the facts of this project, set when the kit was added.
# `/start` still asks for the goal, rigor and automation (Sir's choices).
project:
  stage: Concept
  name: "RE:Compile"
  genre: "First-person action RPG (spellcasting, C++ teaching)"
  goal: hobby

engine:
  name: Godot
  version: "4.7"
  language: GDScript
  rendering: Forward+
  code_root: scripts       # the game's code lives in scripts/, not src/
  test_root: tests

commands:
  # verify.ps1 runs one suite per call; these five are the correctness gate
  # (Performance is a separate, machine-sensitive budget run).
  test: "for s in Content Simulation Render Mobile Playthrough; do powershell.exe -NoProfile -ExecutionPolicy Bypass -File ./verify.ps1 -Suite $s || exit 1; done"
  run: "godot --path . --windowed --resolution 1280x720"
  smoke: "godot_console --headless --path . --quit-after 180"
  build: "godot_console --headless --path . --export-release 'Windows Desktop (encrypted)' ../RECompile-FPS-build/RECompile.exe"

modes:
  rigor: minimal
  automation: guided
